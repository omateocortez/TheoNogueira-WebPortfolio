<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>contact | theo nogueira</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=League+Gothic:wdth@75..100&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Raleway:ital,wght@0,100..900;1,100..900&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
    <link rel="icon" type="image/png" href="../assets/icons/T.png">
    <link rel="stylesheet" href="css/style.css">
</head>

<body class="contact-page">
    <div class="container main-container">
        <header class="site-header reveal-up delay-1">
            <div>
                <a class="theo-brand" href="home.html">theo nogueira</a>
                <div class="site-subtitle">director/writer</div>
            </div>

            <nav class="site-nav">
                <a class="nav-link" href="home.html">home</a>
                <a class="nav-link" href="films.html">film</a>
                <a class="nav-link" href="about.html">about</a>
                <a class="nav-link" href="contact.html">contact</a>
            </nav>
        </header>
    </div>

    <main class="contact-shell">
        <section class="contact-panel reveal-up delay-2">
            <div class="contact-copy">
                <p class="contact-kicker">get in touch</p>
                <h1 class="contact-title">contact</h1>
            </div>

            <div class="contact-block">
                <div class="contact-divider"></div>
                <h2 class="contact-heading">representation</h2>

                <div class="contact-entry">
                    <p class="contact-label">email</p>
                    <a class="contact-link" href="mailto:theonogueira@gmail.com">theonogueira@gmail.com</a>
                </div>

                <div class="contact-entry">
                    <p class="contact-label">based in</p>
                    <p class="contact-text">sao paulo / available for narrative, commercial, and music video work</p>
                </div>

                <div class="contact-divider"></div>

                <div class="contact-entry">
                    <p class="contact-label">social</p>
                    <div class="contact-socials">
                        <a href="https://www.instagram.com/" target="_blank" rel="noreferrer" aria-label="Instagram">
                            <i class="bi bi-instagram"></i>
                        </a>
                        <a href="https://www.vimeo.com/" target="_blank" rel="noreferrer" aria-label="Vimeo">
                            <i class="bi bi-vimeo"></i>
                        </a>
                    </div>
                </div>
            </div>
        </section>

        <section class="contact-visual reveal-up delay-3">
            <img src="../assets/imgs/praca.jpeg" alt="Still frame from Theo Nogueira portfolio" class="contact-image">
        </section>
    </main>

    <div class="container main-container">
        <footer class="footer">
            <div class="social">
                <a href="https://www.instagram.com/" target="_blank" rel="noreferrer">
                    <i class="bi bi-instagram"></i>
                </a>
                <a href="https://www.vimeo.com/" target="_blank" rel="noreferrer">
                    <i class="bi bi-vimeo"></i>
                </a>
            </div>

            <div class="footer-email">
                <a class="email" href="mailto:theonogueira@gmail.com">theonogueira@gmail.com</a>
            </div>
        </footer>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>

</html>
