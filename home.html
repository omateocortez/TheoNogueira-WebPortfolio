<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>home | theo nogueira</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=League+Gothic:wdth@75..100&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Raleway:ital,wght@0,100..900;1,100..900&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
    <link rel="icon" type="image/png" href="../assets/icons/T.png">
    <link rel="stylesheet" href="css/style.css">
</head>

<body>
    <div class="container main-container">
        <header class="site-header reveal-up delay-1">
            <div>
                <a class="theo-brand" href="home.html">theo nogueira</a>
                <div class="site-subtitle">director/writer</div>
            </div>

            <nav class="site-nav">
                <a class="nav-link" href="home.html">home</a>
                <a class="nav-link" href="films.html">film</a>
                <a class="nav-link" href="about.html">about</a>
                <a class="nav-link" href="contact.html">contact</a>
            </nav>
        </header>

        <main class="site-section home-hero">

            <div id="heroCarousel" class="carousel slide carousel-fade reveal-up delay-3">
                <div class="carousel-inner">
                    <div class="carousel-item active">
                        <img src="../assets/imgs/praca.jpeg" alt="Cinematic still from Theo Nogueira portfolio"
                            class="hero-img">
                    </div>

                    <div class="carousel-item">
                        <img src="../assets/imgs/theo.jpeg" alt="Portrait of Theo Nogueira" class="hero-img">
                    </div>

                    <div class="carousel-item">
                        <img src="../assets/imgs/theoProfile.jpeg" alt="Profile still of Theo Nogueira"
                            class="hero-img">
                    </div>
                </div>

                <button class="carousel-control-prev arrow arrow-left" type="button" data-bs-target="#heroCarousel"
                    data-bs-slide="prev" aria-label="Previous slide">
                    <i class="bi bi-chevron-left"></i>
                </button>

                <button class="carousel-control-next arrow arrow-right" type="button" data-bs-target="#heroCarousel"
                    data-bs-slide="next" aria-label="Next slide">
                    <i class="bi bi-chevron-right"></i>
                </button>
            </div>


        </main>

        <footer class="footer">
            <div class="social">
                <a href="https://www.instagram.com/" target="_blank" rel="noreferrer">
                    <i class="bi bi-instagram"></i>
                </a>
                <a href="https://www.vimeo.com/" target="_blank" rel="noreferrer">
                    <i class="bi bi-vimeo"></i>
                </a>
            </div>

            <div class="footer-email">
                <a class="email" href="mailto:theonogueira@gmail.com">theonogueira@gmail.com</a>
            </div>
        </footer>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>

</html>
